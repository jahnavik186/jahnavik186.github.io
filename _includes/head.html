<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>
    {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
  </title>
  <meta name="description" content="{{ site.description | escape }}" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jahnavi Kachhia",
    "url": "https://jahnavik186.github.io/",
    "jobTitle": "Lead AI/ML Researcher",
    "worksFor": {
      "@type": "Organization",
      "name": "Meta"
    },
    "knowsAbout": ["Artificial Intelligence", "Healthcare Informatics", "Machine Learning", "Computer Vision"],
    "sameAs": [
      "https://scholar.google.com/citations?user=bWMslkYAAAAJ",
      "https://www.linkedin.com/in/jk186/",
      "https://orcid.org/0009-0000-5870-5132"
    ],
    "hasCredential": [
      {"@type": "EducationalOccupationalCredential", "name": "Stanford Machine Learning"},
      {"@type": "EducationalOccupationalCredential", "name": "NVIDIA Deep Learning"}
    ],
    "description": "Expert in AI-driven healthcare and smart systems, recognized for leadership in multi-modal AI and peer review for global conferences like AAAI and IJCAI."
  }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />

  {% if site.analytics.ga4 %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.ga4 }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.analytics.ga4 }}');

    document.addEventListener('click', function(event) {
      var link = event.target.closest('a');
      if (!link || !link.href) return;

      var href = link.href;
      var isMailto = href.indexOf('mailto:') === 0;
      var isExternal = link.host && link.host !== window.location.host;

      if (!isExternal && !isMailto) return;

      gtag('event', 'outbound_click', {
        link_url: href,
        link_domain: link.host || 'mailto',
        link_text: (link.textContent || '').trim().slice(0, 100),
        page_location: window.location.href
      });
    }, true);
  </script>
  {% endif %}
</head>
